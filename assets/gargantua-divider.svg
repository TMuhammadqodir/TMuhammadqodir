<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 30" width="100%" height="30" fill="none">
  <defs>
    <linearGradient id="gargantuaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="20%" stop-color="#d97706" stop-opacity="0.3"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#fffbeb" stop-opacity="1"/>
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#d97706" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes pulseHole {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.4); opacity: 1; }
    }
    @keyframes starBlink {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.95; }
    }
    .pulsing-singularity {
      transform-origin: 600px 15px;
      animation: pulseHole 3.5s ease-in-out infinite;
    }
    .s1 { animation: starBlink 2.2s ease-in-out infinite; }
    .s2 { animation: starBlink 3.8s ease-in-out infinite 0.7s; }
    .s3 { animation: starBlink 2.9s ease-in-out infinite 1.4s; }
  </style>

  <!-- Distant Stars -->
  <circle cx="120" cy="12" r="1.2" fill="#fde68a" class="s1" />
  <circle cx="280" cy="18" r="1.5" fill="#ffffff" class="s2" />
  <circle cx="420" cy="10" r="1.2" fill="#fef3c7" class="s3" />
  <circle cx="780" cy="20" r="1.3" fill="#ffffff" class="s1" />
  <circle cx="930" cy="11" r="1.5" fill="#fde68a" class="s2" />
  <circle cx="1070" cy="17" r="1.2" fill="#fef3c7" class="s3" />

  <!-- Gravitational Beam -->
  <line x1="60" y1="15" x2="1140" y2="15" stroke="url(#gargantuaGrad)" stroke-width="1.6" filter="url(#goldGlow)"/>

  <!-- Event Horizon Center -->
  <g class="pulsing-singularity" filter="url(#goldGlow)">
    <circle cx="600" cy="15" r="4.5" fill="#000000" stroke="#f59e0b" stroke-width="1.8" />
    <circle cx="600" cy="15" r="2" fill="#fffbeb" />
  </g>
</svg>
